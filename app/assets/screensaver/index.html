<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Screensaver</title>
<style>
  /* Longhand offsets, not `inset`, and no shadow DOM — the Echo Show's WebView
     is old, and this has to render there. Ported from Voice Satellite. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  #content { position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    transition: transform 2s ease; }
  .media { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: contain; background: #000; opacity: 0; }
  /* A still is a wrapper: the photo, over an optional blurred backdrop that
     is drawn once (Fill the screen). Video and camera elements stand alone. */
  .media > .photo, .media > .backdrop { position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; object-fit: contain; }
  .media > .backdrop { object-fit: cover; }
  .media.cover > .photo { object-fit: cover; }
  .media.cut { opacity: 1; }
  .t-fade { transition: opacity 600ms ease; }
  .t-fade.in { opacity: 1; }
  .t-kenburns { transition: opacity 800ms ease; }
  .t-kenburns.in { opacity: 1; }
  /* The drift moves only the photo: the backdrop beneath stays put, so a
     blurred one is never re-rasterized per frame. */
  .t-kenburns.in > .photo {
    animation: kskb var(--kb-dur, 12s) linear forwards; }
  .photo-paused .photo { animation-play-state: paused !important; }
  @keyframes kskb { to { transform: scale(1.1); } }
  /* 105%, not 100%: subpixel layout must never leave a seam mid-push. */
  .t-slide { opacity: 1; transform: translateX(105%);
    transition: transform 500ms cubic-bezier(0.33, 0, 0.2, 1); }
  .t-slide.in { transform: translateX(0); }
  .t-zoom { transform: scale(1.1);
    transition: opacity 600ms ease, transform 600ms ease; }
  .t-zoom.in { opacity: 1; transform: scale(1); }
  /* Applied by an incoming slide to whatever sits beneath it, whatever
     class that element entered with. !important outranks the Ken Burns
     animation, which would otherwise keep owning transform. */
  .media.slide-out { animation: none;
    transform: translateX(-105%) !important;
    transition: transform 500ms cubic-bezier(0.33, 0, 0.2, 1); }
  iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    border: 0; opacity: 0; transition: opacity 600ms ease;
    /* Taps must reach our dismiss handler, not the embedded site. */
    pointer-events: none; }
  iframe.in { opacity: 1; }
  #msg { position: absolute; top: 50%; left: 0; right: 0; text-align: center;
    transform: translateY(-50%); color: #bbb; padding: 0 8vw;
    font: 3vw system-ui, sans-serif; }
</style>
</head>
<body>
<div id="content"></div>
<div id="msg"></div>
<!-- The config arrives as an AT_DOCUMENT_START UserScript, but WebViews
     older than 91 have no DOCUMENT_START_SCRIPT and the plugin's fallback
     injection loses the race against this page's parse, leaving the
     screensaver configless (issue #399). The page's own script waits in
     screensaver.js: booted here where the injection won, and from the
     app's onLoadStop push (ksSetConfig) where it lost. -->
<script>
'use strict';
(() => {
  const boot = () => {
    const script = document.createElement('script');
    script.src = 'screensaver.js';
    script.async = false;
    document.body.appendChild(script);
  };
  if (window.__ksScreensaver) {
    boot();
  } else {
    window.ksSetConfig = (config) => {
      window.ksSetConfig = null;
      window.__ksScreensaver = config;
      boot();
    };
  }
})();
</script>
</body>
</html>

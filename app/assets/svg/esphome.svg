<!--
  The ESPHome mark, simplified to a flat monochrome glyph: the house drawn
  as one circuit trace with node dots at its three terminals, which is the
  shape the project's logo builds on. Stroke plus filled circles so a
  single srcIn tint colors the whole mark; the viewBox is padded to carry
  the same optical margin as the Material glyphs beside it.
-->
<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M25 82 L25 46 L50 24 L75 46 L75 82"
        stroke="#000" stroke-width="9" stroke-linecap="round"
        stroke-linejoin="round"/>
  <circle cx="25" cy="82" r="8" fill="#000"/>
  <circle cx="75" cy="82" r="8" fill="#000"/>
  <circle cx="50" cy="24" r="8" fill="#000"/>
  <circle cx="50" cy="60" r="7" fill="#000"/>
</svg>

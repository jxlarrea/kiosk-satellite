<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camera view</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden;
    background: #000; color: #fff; font-family: system-ui, sans-serif; }
  #grid { position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    display: grid; gap: 2px; background: #111; touch-action: none;
    user-select: none; }
  #grid.n1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  #grid.n2.landscape { grid-template-columns: 1fr 1fr; }
  #grid.n2.portrait { grid-template-rows: 1fr 1fr; }
  #grid.n3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  #grid.n3.landscape .tile:first-child { grid-row: 1 / 3; }
  #grid.n3.portrait .tile:first-child { grid-column: 1 / 3; }
  #grid.n4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  #grid.focus { display: block; }
  .tile { position: relative; min-width: 0; min-height: 0; overflow: hidden;
    background: #000; }
  .tile.hidden { display: none; }
  .tile.focused { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .name { position: absolute; left: 12px; bottom: 10px; max-width: 75%;
    padding: 5px 9px; border-radius: 7px; background: rgba(0, 0, 0, .58);
    font-size: 14px; line-height: 18px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #grid.hide-names .name { display: none; }
  .status { position: absolute; top: 50%; left: 12px; right: 12px;
    transform: translateY(-50%); color: #aaa; text-align: center;
    font-size: 15px; pointer-events: none; }
</style>
</head>
<body>
<div id="grid"></div>
<script>
'use strict';
const CFG = window.__ksCameraView || { cameras: [], showCameraNames: true };
const grid = document.getElementById('grid');
const bridge = (name, value) =>
  window.flutter_inappwebview.callHandler(name, value);
const sessions = new Map();
let focusId = CFG.focusedCameraId || null;
let swipeStart = null;
let lastTap = null;
let tapTimer = null;
let closing = false;
const DOUBLE_TAP_MS = 350;

function log(message) {
  try { bridge('cameraLog', String(message)); } catch (_) {}
}

function orientation() {
  return innerWidth >= innerHeight ? 'landscape' : 'portrait';
}

function applyLayout() {
  grid.className = `n${CFG.cameras.length} ${orientation()}`
    + `${focusId ? ' focus' : ''}`
    + `${CFG.showCameraNames === false ? ' hide-names' : ''}`;
  for (const tile of grid.children) {
    const active = !focusId || tile.dataset.id === focusId;
    tile.classList.toggle('hidden', !active);
    tile.classList.toggle('focused', !!focusId && active);
  }
}

function setStatus(cameraId, text) {
  const tile = document.querySelector(`.tile[data-id="${CSS.escape(cameraId)}"]`);
  if (tile) tile.querySelector('.status').textContent = text || '';
}

function waitForIce(pc) {
  if (pc.iceGatheringState === 'complete') return Promise.resolve();
  return new Promise((resolve) => {
    const finish = () => {
      pc.removeEventListener('icegatheringstatechange', changed);
      clearTimeout(timer);
      resolve();
    };
    const changed = () => {
      if (pc.iceGatheringState === 'complete') finish();
    };
    const timer = setTimeout(finish, 2500);
    pc.addEventListener('icegatheringstatechange', changed);
  });
}

function stop(cameraId) {
  const session = sessions.get(cameraId);
  if (!session) return;
  session.wanted = false;
  clearTimeout(session.retry);
  if (session.pc) {
    session.pc.ontrack = null;
    session.pc.onconnectionstatechange = null;
    for (const receiver of session.pc.getReceivers()) {
      if (receiver.track) receiver.track.stop();
    }
    session.pc.close();
  }
  if (session.video) {
    session.video.pause();
    if (session.video.srcObject) {
      for (const track of session.video.srcObject.getTracks()) track.stop();
    }
    session.video.srcObject = null;
    session.video.removeAttribute('src');
    session.video.load();
    session.video.remove();
  }
  sessions.delete(cameraId);
}

function shutdown() {
  for (const camera of CFG.cameras) stop(camera.id);
}

function clearPendingTap() {
  clearTimeout(tapTimer);
  tapTimer = null;
  lastTap = null;
}

function closeView() {
  if (closing) return;
  closing = true;
  clearPendingTap();
  shutdown();
  bridge('cameraClose');
}

async function start(cameraId, fullscreen) {
  stop(cameraId);
  const session = { wanted: true, pc: null, video: null, retry: null, attempt: 0 };
  sessions.set(cameraId, session);

  const connect = async () => {
    if (!session.wanted || sessions.get(cameraId) !== session) return;
    setStatus(cameraId, 'Connecting...');
    const pc = new RTCPeerConnection();
    session.pc = pc;
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.ontrack = (event) => {
      if (!session.wanted || !event.streams.length) return;
      const tile = document.querySelector(`.tile[data-id="${CSS.escape(cameraId)}"]`);
      if (!tile) return;
      let video = tile.querySelector('video');
      if (!video) {
        video = document.createElement('video');
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;
        video.setAttribute('muted', '');
        video.setAttribute('playsinline', '');
        tile.insertBefore(video, tile.firstChild);
      }
      session.video = video;
      video.srcObject = event.streams[0];
      video.play().catch((error) => log(`play ${cameraId}: ${error}`));
      setStatus(cameraId, '');
    };
    pc.onconnectionstatechange = () => {
      if (!session.wanted) return;
      if (pc.connectionState === 'failed' ||
          pc.connectionState === 'disconnected' ||
          pc.connectionState === 'closed') {
        pc.close();
        session.attempt++;
        const delay = Math.min(30000, 1000 * Math.pow(2, session.attempt));
        setStatus(cameraId, 'Reconnecting...');
        clearTimeout(session.retry);
        session.retry = setTimeout(connect, delay);
      } else if (pc.connectionState === 'connected') {
        session.attempt = 0;
      }
    };
    try {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await waitForIce(pc);
      const result = await bridge('cameraOffer', {
        cameraId,
        offer: pc.localDescription.sdp,
        fullscreen,
      });
      if (!session.wanted) {
        pc.close();
        return;
      }
      if (!result || result.ok !== true) {
        throw new Error(result && result.error || 'signaling failed');
      }
      await pc.setRemoteDescription({ type: 'answer', sdp: result.answer });
    } catch (error) {
      log(`connect ${cameraId}: ${error}`);
      pc.close();
      if (!session.wanted) return;
      session.attempt++;
      const delay = Math.min(30000, 1000 * Math.pow(2, session.attempt));
      setStatus(cameraId, `Connection failed. Retrying in ${Math.round(delay / 1000)}s`);
      session.retry = setTimeout(connect, delay);
    }
  };
  connect();
}

function syncPeers() {
  for (const camera of CFG.cameras) {
    const wanted = !focusId || camera.id === focusId;
    if (!wanted) {
      stop(camera.id);
    } else if (!sessions.has(camera.id)) {
      start(camera.id, !!focusId);
    }
  }
}

function setFocus(cameraId, notify) {
  focusId = cameraId || null;
  applyLayout();
  syncPeers();
  if (notify) bridge('cameraFocus', { cameraId: focusId || '' });
}

for (const camera of CFG.cameras) {
  const tile = document.createElement('div');
  tile.className = 'tile';
  tile.dataset.id = camera.id;
  tile.innerHTML =
    `<div class="status">${camera.missing ? 'Stream missing from Go2RTC' : 'Connecting...'}</div>` +
    `<div class="name"></div>`;
  tile.querySelector('.name').textContent = camera.name;
  grid.appendChild(tile);
}

grid.addEventListener('click', (event) => {
  const tile = event.target.closest('.tile');
  if (!tile) return;

  const cameraId = tile.dataset.id;
  const now = performance.now();
  if (lastTap &&
      lastTap.cameraId === cameraId &&
      now - lastTap.at <= DOUBLE_TAP_MS) {
    clearPendingTap();
    if (focusId) {
      setFocus(null, true);
    } else {
      closeView();
    }
    return;
  }

  clearPendingTap();
  lastTap = { cameraId, at: now };
  const camera = CFG.cameras.find((candidate) => candidate.id === cameraId);
  const canFocus = !focusId && CFG.cameras.length > 1 &&
    camera && !camera.missing;
  tapTimer = setTimeout(() => {
    tapTimer = null;
    lastTap = null;
    if (canFocus && !focusId) setFocus(cameraId, true);
  }, DOUBLE_TAP_MS);
});
document.addEventListener('pointerdown', (event) => {
  swipeStart = event.clientX <= 36 ? { x: event.clientX, y: event.clientY } : null;
}, true);
document.addEventListener('pointerup', (event) => {
  if (!swipeStart) return;
  const dx = event.clientX - swipeStart.x;
  const dy = Math.abs(event.clientY - swipeStart.y);
  swipeStart = null;
  if (dx < 80 || dx <= dy) return;
  clearPendingTap();
  if (focusId) {
    setFocus(null, true);
  } else {
    closeView();
  }
}, true);
document.addEventListener('pointercancel', () => {
  swipeStart = null;
}, true);
addEventListener('resize', applyLayout);
addEventListener('pagehide', shutdown);
applyLayout();
syncPeers();
</script>
</body>
</html>

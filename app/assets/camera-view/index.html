<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camera view</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden;
    background: #000; color: #fff; font-family: system-ui, sans-serif; }
  #grid { position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    display: grid; gap: 2px; background: #111; touch-action: none;
    user-select: none; }
  #grid.focus { display: block; }
  .tile { position: relative; min-width: 0; min-height: 0; overflow: hidden;
    background: #000; }
  .tile.hidden { display: none; }
  .tile.focused { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  video, img.mjpeg { width: 100%; height: 100%; object-fit: contain;
    background: #000; display: block; }
  /* Pinch to zoom (issue #286). The tile carries the transform rather than
     the media element, which a reconnect replaces: a stream that drops and
     comes back keeps the zoom the fingers set. */
  .tile.zoomed video, .tile.zoomed img.mjpeg {
    transform: translate(var(--zoom-x, 0px), var(--zoom-y, 0px))
      scale(var(--zoom-scale, 1)); }
  /* Belt for WebViews that predate disableRemotePlayback: never draw the
     media-controls overlay cast button on a camera tile. */
  video::-internal-media-controls-overlay-cast-button { display: none !important; }
  .name { position: absolute; left: 12px; bottom: 10px; max-width: 75%;
    padding: 5px 9px; border-radius: 7px; background: rgba(0, 0, 0, .58);
    font-size: 14px; line-height: 18px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #grid.hide-names .name { display: none; }
  .status { position: absolute; top: 50%; left: 12px; right: 12px;
    transform: translateY(-50%); color: #aaa; text-align: center;
    font-size: 15px; pointer-events: none; }
</style>
</head>
<body>
<div id="grid"></div>
<!-- hls.js light build v1.6.16 (the same file Voice Satellite vendors):
     the page is a local asset and loads nothing remote. Drives the HLS
     transport for Home Assistant cameras that do not stream WebRTC
     (plays through MediaSource, like the MSE rung). The light build
     drops subtitles, alternate audio renditions and DRM, none of which
     a camera stream carries. Deferred: parsing a third of a megabyte
     blocks the page's first paint, which showed as a white flash while
     the view slid up. Only connectHls needs it, and it waits for
     DOMContentLoaded. -->
<script defer src="hls.light.min.js"></script>
<!-- The config arrives as an AT_DOCUMENT_START UserScript, but WebViews
     older than 91 have no DOCUMENT_START_SCRIPT and the plugin's fallback
     injection loses the race against this page's parse, freezing the view
     on an empty camera list (issue #399). The page's own script waits in
     camera-view.js: booted here where the injection won, and from the
     app's onLoadStop push (ksSetConfig) where it lost. -->
<script>
'use strict';
(() => {
  const boot = () => {
    const script = document.createElement('script');
    script.src = 'camera-view.js';
    script.async = false;
    document.body.appendChild(script);
  };
  if (window.__ksCameraView) {
    boot();
  } else {
    window.ksSetConfig = (config) => {
      window.ksSetConfig = null;
      window.__ksCameraView = config;
      boot();
    };
  }
})();
</script>
</body>
</html>

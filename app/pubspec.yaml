name: kiosk_satellite
description: "Modern kiosk browser for Home Assistant — companion app for Voice Satellite."
publish_to: 'none'

version: 2026.9.3+202

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # WebView + JS bridge. Beta needed: 6.1.x's Android gradle file is
  # incompatible with the AGP 9 the current Flutter template uses.
  flutter_inappwebview: ^6.2.0-beta.3

  # Screen / device
  screen_brightness: ^2.1.0
  wakelock_plus: ^1.2.10
  battery_plus: ^6.2.1
  device_info_plus: ^11.3.0
  package_info_plus: ^8.1.2

  # Remote management server
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.2

  # Home Assistant client
  http: ^1.3.0

  # Persistence
  shared_preferences: ^2.5.2

  # HMAC for stateless remote-admin tokens (survive app restarts)
  crypto: ^3.0.6
  file_picker: ^8.1.2
  flutter_svg: ^2.0.10
  image_picker: ^1.1.2
  video_player: ^2.9.2

  # Share sheet (console log export)
  share_plus: ^10.1.4

  # Runtime permissions (mic for Voice Satellite, camera for motion)
  permission_handler: ^11.3.1

  # Native wake-word inference: ONNX runtime (mic capture is a platform
  # channel in android/, to avoid third-party AGP-9 build breakage).
  # ffi backs the zero-copy tensor I/O in vsww/ort_tensor_io.dart.
  onnxruntime: ^1.4.1
  ffi: ^2.1.0
  path_provider: ^2.1.5
  tflite_flutter: ^0.12.1
  mqtt_client: ^10.11.11
  # Uint8Buffer for the MQTT camera entity's binary JPEG payloads (already
  # a transitive dependency of mqtt_client; direct so we can import it).
  typed_data: ^1.4.0
  intl: ^0.20.3
  mobile_scanner: ^7.4.0
  mqtt5_client: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Launcher icons for both platforms, generated from the master art in
# ../assets/icons (run: dart run flutter_launcher_icons). Only the legacy
# Android mipmaps and the iOS set come from here. The Android adaptive
# icon (android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml) and
# its three layers in res/drawable are hand-kept vector drawables
# converted from ../assets/icons/svg/adaptive-*.svg, so launchers that
# draw icons larger than 48dp (a Meta Portal draws 152px tiles on an mdpi
# panel) get a sharp icon; density PNG layers were upscaled there. The
# 12% inset on the foreground lives in that XML.
flutter_launcher_icons:
  android: true
  image_path_android: ../assets/icons/png-rounded/icon-1024.png
  ios: true
  image_path_ios: ../assets/icons/png-square/icon-1024.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/remote-ui/index.html
    - assets/remote-ui/static/
    - assets/screensaver/index.html
    - assets/screensaver/screensaver.js
    - assets/camera-view/index.html
    - assets/camera-view/camera-view.js
    - assets/camera-view/hls.light.min.js
    - assets/branding/icon.png
    - assets/branding/mark.png
    - assets/svg/
    - assets/branding/mark_light.png
    - assets/branding/hacs.svg
    - assets/branding/mark.svg
    - assets/sounds/notification.ogg
    - assets/camera/camera_off.jpg
    - assets/mdi/
  fonts:
    # Rubik (SIL Open Font License) — an open geometric sans that gives the
    # clock the clean, friendly feel of Google Sans without the licensing.
    # The TTF carries a `wght` axis, so w300/w400 in TextStyle map to it.
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik.ttf
    # The Clock screensaver's Nunito option (issue #391): the OP's Apple
    # StandBy reference is SF Pro Rounded, and Nunito (Google Fonts, SIL
    # OFL) is the closest open rounded face. A variable TTF with a wght
    # axis, like Rubik, so the clock's light and heavy weights are real.
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    # The Clock screensaver's Inter option: the open neo-grotesque that
    # stands in for Helvetica Neue (rsms/inter, SIL OFL, license beside
    # the file). The Google Fonts variable cut, with a wght axis for the
    # weight picker and an opsz axis whose display end the faces ask for
    # at clock sizes, where the text cut's loose spacing shows.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    # The Clock screensaver's LCD font option (issue #391): DSEG14 Classic
    # (keshikan/DSEG, SIL OFL, license beside the file), the segmented
    # display face of an LED alarm clock. The fourteen-segment cut rather
    # than DSEG7: digits render identically to seven-segment, but letters
    # and punctuation exist too, so the date and AM/PM stay in character
    # instead of falling back to the platform font. Single weight; the
    # clock's light and heavy weights all land on it.
    - family: DSEG14
      fonts:
        - asset: assets/fonts/DSEG14.ttf
